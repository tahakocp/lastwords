name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test
      - name: package
        run: |
          name=lastwords-${GITHUB_REF_NAME#v}
          mkdir -p dist/$name
          cp src/lastwords.c src/lastwords.h tools/lwsym.py tools/lwdecode.py LICENSE README.md CHANGELOG.md dist/$name/
          cp -r web dist/$name/web
          mkdir -p dist/$name/rust && cp -r rust/Cargo.toml rust/build.rs rust/src rust/qemu dist/$name/rust/
          rm -rf dist/$name/rust/qemu/target
          mkdir -p dist/$name/rust/csrc && cp src/lastwords.c src/lastwords.h dist/$name/rust/csrc/
          (cd dist && zip -r $name.zip $name)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" \
            --notes "$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)"
