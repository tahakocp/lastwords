name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test CC=${{ matrix.cc }}
      - run: make test-asan CC=${{ matrix.cc }}
      - name: CMake consumer build
        run: |
          cmake -S . -B build/cmake -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build/cmake

  qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install arm-none-eabi-gcc and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi qemu-system-arm
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1
      - name: compile for M0+/M3/M4/M7/M23/M33/M55
        run: make cross
      - name: five boots, four crashes, on M0/M3/M4/M7
        run: make qemu
      - name: footprint and instruction count
        run: |
          make size
          make footprint
          make count
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-transcripts
          path: examples/qemu/build/run-*.txt

  armv8m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install arm-none-eabi-gcc and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi qemu-system-arm
          arm-none-eabi-gcc --version | head -1
          qemu-system-arm --version | head -1
      - name: six boots on a TrustZone Cortex-M55 (mps3-an547)
        run: make armv8m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: armv8m-transcript
          path: examples/armv8m/build/run-m55.txt

  riscv:
    runs-on: ubuntu-latest
    env:
      XPACK_GCC: 14.2.0-3
      XPACK_QEMU: 9.2.4-1
    steps:
      - uses: actions/checkout@v5
      - name: install xPack riscv-none-elf-gcc and qemu-system-riscv32
        run: |
          mkdir -p ~/xpack && cd ~/xpack
          curl -fsSL https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v$XPACK_GCC/xpack-riscv-none-elf-gcc-$XPACK_GCC-linux-x64.tar.gz | tar xz
          curl -fsSL https://github.com/xpack-dev-tools/qemu-riscv-xpack/releases/download/v$XPACK_QEMU/xpack-qemu-riscv-$XPACK_QEMU-linux-x64.tar.gz | tar xz
          echo "$HOME/xpack/xpack-riscv-none-elf-gcc-$XPACK_GCC/bin" >> $GITHUB_PATH
          echo "$HOME/xpack/xpack-qemu-riscv-$XPACK_QEMU/bin" >> $GITHUB_PATH
      - name: compile for rv32imac and rv32imc
        run: |
          riscv-none-elf-gcc --version | head -1
          qemu-system-riscv32 --version | head -1
          for a in rv32imac_zicsr rv32imc_zicsr; do
            riscv-none-elf-gcc -march=$a -mabi=ilp32 -Os -std=c99 -Wall -Wextra -Wpedantic -Werror -c src/lastwords.c -o /dev/null
            echo "$a ok"
          done
      - name: six boots, four traps, on QEMU virt
        run: make riscv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riscv-transcript
          path: examples/riscv/build/run-rv32.txt
